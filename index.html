<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구실 장갑 사이즈 설문</title>
<meta property="og:title" content="🧤 연구실 장갑 사이즈 설문">
<meta property="og:description" content="실험용 장갑 · 글로브박스용 장갑 사이즈를 하나씩 골라 주세요.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --ink:#1c2321; --muted:#6b7672; --line:#dfe5e2;
    --lab:#0f7b6c; --lab-soft:#e3f2ef; --box:#3d5a99; --box-soft:#e7ecf7; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141817; --card:#1d2220; --ink:#e9eeec; --muted:#9aa5a1; --line:#2e3533;
      --lab:#3fb8a5; --lab-soft:#1e3330; --box:#7d9be0; --box-soft:#222b40; --err:#ff7b6b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px}
  header h1{font-size:1.55rem;margin:0 0 4px}
  header p{margin:0;color:var(--muted);font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
  label.title{display:block;font-weight:700;margin-bottom:8px}
  .req{color:var(--err);margin-left:2px}
  input[type=text]{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-family:inherit}
  input[type=text]:focus{outline:2px solid var(--lab);border-color:transparent}
  .q-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .badge{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px}
  .lab .badge{background:var(--lab-soft);color:var(--lab)}
  .box .badge{background:var(--box-soft);color:var(--box)}
  .hint{color:var(--muted);font-size:.85rem;margin:0 0 12px}
  .sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sizes input{position:absolute;opacity:0;pointer-events:none}
  .sizes label{display:flex;align-items:center;justify-content:center;height:54px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:1.05rem;cursor:pointer;user-select:none;transition:.12s}
  .lab .sizes input:checked + label{background:var(--lab);border-color:var(--lab);color:#fff}
  .box .sizes input:checked + label{background:var(--box);border-color:var(--box);color:#fff}
  .sizes input:focus-visible + label{outline:2px solid var(--ink)}
  button.submit{width:100%;margin-top:18px;padding:14px;font-size:1.05rem;font-weight:700;border:0;border-radius:12px;background:var(--ink);color:var(--bg);cursor:pointer;font-family:inherit}
  button.submit:disabled{opacity:.5;cursor:default}
  .msg{margin-top:12px;font-size:.92rem;min-height:1.2em}
  .msg.err{color:var(--err)} .msg.ok{color:var(--lab)}
  h2{font-size:1.15rem;margin:0 0 12px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:520px){.summary{grid-template-columns:1fr}}
  .sum-col h3{font-size:.9rem;margin:0 0 8px}
  .bar-row{display:grid;grid-template-columns:30px 1fr 28px;align-items:center;gap:8px;font-size:.88rem;margin:4px 0}
  .bar{height:14px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar span{display:block;height:100%;border-radius:4px}
  .lab-c .bar span{background:var(--lab)} .box-c .bar span{background:var(--box)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:.82rem}
  .empty{color:var(--muted);font-size:.9rem}
  .count{color:var(--muted);font-size:.85rem;font-weight:400;margin-left:6px}
  .notice{background:var(--box-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧤 연구실 장갑 사이즈 설문</h1>
    <p>실험용 장갑과 글로브박스용 장갑의 사이즈를 각각 하나씩 선택해 주세요. (실명 설문)</p>
  </header>

  <form id="form" class="card" novalidate>
    <label class="title" for="name">이름<span class="req">*</span></label>
    <input type="text" id="name" maxlength="30" placeholder="실명을 입력해 주세요" autocomplete="name">

    <div class="lab" style="margin-top:22px">
      <div class="q-head"><label class="title" style="margin:0">실험용 장갑<span class="req">*</span></label><span class="badge">1개 선택</span></div>
      <p class="hint">일반 실험 시 착용하는 니트릴/라텍스 장갑</p>
      <div class="sizes" id="labSizes"></div>
    </div>

    <div class="box" style="margin-top:22px">
      <div class="q-head"><label class="title" style="margin:0">글로브박스용 장갑<span class="req">*</span></label><span class="badge">1개 선택</span></div>
      <p class="hint">글로브박스 작업 시 안쪽에 착용하는 장갑</p>
      <div class="sizes" id="boxSizes"></div>
    </div>

    <button type="submit" class="submit" id="submitBtn">제출하기</button>
    <div class="msg" id="msg"></div>
    <p class="hint" style="margin:10px 0 0">같은 이름으로 다시 제출하면 이전 응답이 수정됩니다.</p>
  </form>

  <section class="card">
    <h2>응답 현황<span class="count" id="total"></span></h2>
    <div class="summary">
      <div class="sum-col lab-c"><h3>실험용 장갑</h3><div id="labBars"></div></div>
      <div class="sum-col box-c"><h3>글로브박스용 장갑</h3><div id="boxBars"></div></div>
    </div>
    <h3 style="font-size:.9rem;margin:18px 0 6px">응답한 사람</h3>
    <div id="names" class="hint">불러오는 중…</div>
  </section>
</div>

<script>
// ▼▼▼ Apps Script 배포 후 받은 "웹 앱 URL"을 여기에 붙여 넣으세요 ▼▼▼
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEgER8IXhKl1kO5k1cNCHdS02Pfj90Rhqg1thIo5L2uv-Dm8L2zsVmwKzLqzDBRMa0Ng/exec";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const SIZES = ["XS","S","M","L","XL"];
const $ = id => document.getElementById(id);
const configured = SCRIPT_URL.startsWith("https://");

function buildSizes(id, g){
  $(id).innerHTML = SIZES.map(s=>`<input type="radio" name="${g}" id="${g}-${s}" value="${s}"><label for="${g}-${s}">${s}</label>`).join("");
}
buildSizes("labSizes","lab"); buildSizes("boxSizes","box");
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setMsg(t,c){ const m=$("msg"); m.textContent=t; m.className="msg "+(c||""); }

function renderStats(d){
  $("total").textContent = `총 ${d.total}명`;
  ["lab","box"].forEach(k=>{
    const c=d[k]||{}; const max=Math.max(1,...SIZES.map(s=>c[s]||0));
    $(k+"Bars").innerHTML = SIZES.map(s=>`<div class="bar-row"><b>${s}</b><div class="bar"><span style="width:${(c[s]||0)/max*100}%"></span></div><span class="num">${c[s]||0}</span></div>`).join("");
  });
  const names=(d.names||[]).slice().sort((a,b)=>a.localeCompare(b,"ko"));
  $("names").innerHTML = names.length ? names.map(esc).join(", ") : "아직 응답이 없습니다.";
}
renderStats({total:0,lab:{},box:{},names:[]});

async function loadStats(){
  if(!configured){ $("names").textContent="설문 저장소가 아직 연결되지 않았습니다 (관리자 설정 필요)."; return; }
  try{
    const r = await fetch(SCRIPT_URL); const d = await r.json();
    if(d.ok) renderStats(d);
  }catch(e){ $("names").textContent="현황을 불러오지 못했습니다."; }
}
loadStats();

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const name=$("name").value.trim();
  const lab=document.querySelector("input[name=lab]:checked")?.value;
  const box=document.querySelector("input[name=box]:checked")?.value;
  if(!name){ setMsg("이름을 입력해 주세요.","err"); $("name").focus(); return; }
  if(!lab){ setMsg("실험용 장갑 사이즈를 선택해 주세요.","err"); return; }
  if(!box){ setMsg("글로브박스용 장갑 사이즈를 선택해 주세요.","err"); return; }
  if(!configured){ setMsg("설문 저장소가 아직 연결되지 않았습니다. 관리자에게 문의해 주세요.","err"); return; }
  const btn=$("submitBtn"); btn.disabled=true; setMsg("제출 중…");
  const body=JSON.stringify({name,lab,box});
  try{
    let ok=false, updated=false;
    try{
      const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
      const d=await r.json(); ok=d.ok; updated=d.updated;
    }catch(_){
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
      ok=true;
    }
    if(ok){ setMsg(`${updated?"수정":"제출"} 완료! (${name} · 실험용 ${lab} · 글로브박스용 ${box})`,"ok"); btn.textContent="응답 수정하기"; setTimeout(loadStats,800); }
    else setMsg("입력값을 확인해 주세요.","err");
  }catch(err){ setMsg("제출하지 못했습니다. 잠시 후 다시 시도해 주세요.","err"); }
  finally{ btn.disabled=false; }
});
</script>
</body>
</html>
